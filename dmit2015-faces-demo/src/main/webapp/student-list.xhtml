<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:p="primefaces"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html">

<f:view>
    <h:head>
        <title>Student List</title>
    </h:head>
    <h:body>
        <h:form>
            <p:dataTable id="studentInfosDataTable"
                            value="#{studentListSession.studentInfos}"
                            var="currentStudent">
            <p:column headerText="Student Name">
                <h:outputText value="#{currentStudent.fullName}" />
            </p:column>

            <p:column headerText="Program">
                <h:outputText value="#{currentStudent.program}" />
            </p:column>

             <p:column headerText="Full Time?">
                 <p:selectBooleanCheckbox value="#{currentStudent.fullTime}"
                                          disabled="true" />
             </p:column>

              <p:column headerText="Action">
                  <p:commandButton value="remove"
                                   action="#{studentListSession.removeStudenInfo(currentStudent)}"
                                   process="@this"
                                   update="studentInfosDataTAble" />
              </p:column>

            </p:dataTable>
        </h:form>
    </h:body>
</f:view>
</html>
